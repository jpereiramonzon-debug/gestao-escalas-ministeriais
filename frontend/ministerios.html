<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Ministérios</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .btn-voltar { display: block; width: fit-content; margin: 0 auto 20px; padding: 10px 20px; background: white; border: 1px solid #4a235a; border-radius: 4px; text-decoration: none; color: #4a235a; font-weight: 500; }
        .card { background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #4a235a; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; max-height: 200px; overflow-y: auto; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background: #fdfdfd; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-weight: normal; }
        small { color: #666; display: block; margin-bottom: 15px; }
        a { color: #4a235a; }
        .btn-salvar { background-color: #5b2c6f; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; width:100%; margin-top:10px; transition:0.2s;}
        .btn-salvar:hover { background-color: #4a235a; }
        
        /* Padrão visual idêntico à tela de Funções */
        .item-lista { display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 10px; background: #f9f9f9; }
        .item-info { flex: 1; }
        .item-nome { font-weight: bold; color: #4a235a; font-size: 1.1em; margin-bottom: 5px;}
        .item-detalhes { color: #555; font-size: 0.9em; line-height: 1.5; }
        
        .acoes { display: flex; gap: 10px; }
        .btn-acao { background: white; border: 1px solid #ccc; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; color: #333; transition: 0.2s; font-weight: 500;}
        .btn-acao:hover { background: #eee; }
        .btn-excluir { border-color: #e74c3c; color: white; background: #e74c3c; }
        .btn-excluir:hover { background: #c0392b; border-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>

        <div class="card">
            <h2>Cadastrar Ministério (UC02)</h2>
            <form id="form-ministerio">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="nome">Nome do Ministério:</label>
                    <input type="text" id="nome" placeholder="Ex: Louvor, Som e Mídia" required>
                </div>

                <div class="form-group">
                    <label>Funções Obrigatórias (marque as que este ministério exige):</label>
                    <div id="container-funcoes" class="checkbox-group">
                        <em>Carregando funções cadastradas...</em>
                    </div>
                    <small>Não encontrou a função que precisa? <a href="funcoes.html">Cadastre uma nova função</a> primeiro.</small>
                </div>

                <button type="submit" class="btn-salvar" id="btn-submit">Salvar Ministério</button>
                <button type="button" class="btn-acao" id="btn-cancelar" style="display:none; width:100%; margin-top:10px;" onclick="cancelarEdicao()">Cancelar Edição</button>
            </form>
        </div>

        <div class="card">
            <h2>Ministérios Cadastrados</h2>
            <div class="form-group">
                <input type="text" id="pesquisa" placeholder="Pesquisar por ministério ou função...">
            </div>
            <div id="lista-ministerios">
                <!-- Lista injetada pelo JS -->
            </div>
        </div>
    </div>

    <script src="js/ministerios.js"></script>
</body>
</html>
