<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Voluntários</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .btn-voltar { display: block; width: fit-content; margin: 0 auto 20px; padding: 10px 20px; background: white; border: 1px solid #4a235a; border-radius: 4px; text-decoration: none; color: #4a235a; font-weight: 500; }
        .card { background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #4a235a; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; max-height: 200px; overflow-y: auto; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background: #fdfdfd; }
        .checkbox-row { display: flex; flex-wrap: wrap; gap: 15px; flex-direction: row; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; }
        
        .btn-salvar { background-color: #5b2c6f; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn-salvar:hover { background-color: #4a235a; }
        
        .item-lista { display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 10px; background: #f9f9f9; }
        .item-info { flex: 1; }
        .item-nome { font-weight: bold; color: #4a235a; font-size: 1.1em; margin-bottom: 5px;}
        .item-detalhes { color: #555; font-size: 0.9em; line-height: 1.5; }
        
        .acoes { display: flex; gap: 10px; }
        .btn-acao { background: white; border: 1px solid #ccc; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; color: #333; transition: 0.2s; font-weight: 500;}
        .btn-acao:hover { background: #eee; }
        .btn-excluir { border-color: #e74c3c; color: white; background: #e74c3c; }
        .btn-excluir:hover { background: #c0392b; border-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>

        <div class="card">
            <h2>Cadastrar Voluntário (UC01)</h2>
            <form id="form-voluntario">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label for="ministerio">Ministério:</label>
                    <select id="ministerio" required>
                        <option value="">-- Carregando ministérios... --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Funções Aptas:</label>
                    <div id="container-funcoes-voluntario" class="checkbox-group">
                        <em style="color: #888;">Selecione um ministério acima para carregar as funções...</em>
                    </div>
                </div>

                <div class="form-group">
                    <label>Dias da Semana Disponíveis:</label>
                    <div class="checkbox-group checkbox-row">
                        <label class="checkbox-item"><input type="checkbox" name="disponibilidade" value="DOMINGO"> Domingo</label>
                        <label class="checkbox-item"><input type="checkbox" name="disponibilidade" value="SEGUNDA"> Segunda</label>
                        <label class="checkbox-item"><input type="checkbox" name="disponibilidade" value="TERÇA"> Terça</label>
                        <label class="checkbox-item"><input type="checkbox" name="disponibilidade" value="QUARTA"> Quarta</label>
                        <label class="checkbox-item"><input type="checkbox" name="disponibilidade" value="QUINTA"> Quinta</label>
                        <label class="checkbox-item"><input type="checkbox" name="disponibilidade" value="SEXTA"> Sexta</label>
                        <label class="checkbox-item"><input type="checkbox" name="disponibilidade" value="SÁBADO"> Sábado</label>
                    </div>
                    <small style="color:#666; display:block; margin-top:5px; font-size:12px;">
                        * Se não marcar nenhum dia, o sistema considerará que o voluntário está sempre disponível.
                    </small>
                </div>

                <button type="submit" class="btn-salvar" id="btn-submit">Salvar Voluntário</button>
                <button type="button" class="btn-acao" id="btn-cancelar" style="display:none; width:100%; margin-top:10px;" onclick="cancelarEdicao()">Cancelar Edição</button>
            </form>
        </div>

        <div class="card">
            <h2>Voluntários Cadastrados</h2>
            <div class="form-group">
                <input type="text" id="pesquisa" placeholder="Pesquisar por nome, ministério ou função...">
            </div>
            <div id="lista-voluntarios">
                <!-- Lista injetada pelo JS -->
            </div>
        </div>
    </div>

    <script src="js/voluntarios.js"></script>
</body>
</html>
