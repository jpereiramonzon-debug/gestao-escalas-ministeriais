<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal IEQ - Gestão de Escalas Ministeriais</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>Portal IEQ - Gestão de Escalas</h1>
    <p>Painel Administrativo do Coordenador Ministerial</p>
  </header>

  <main class="container">
    <!-- Form Ministério -->
    <section class="card">
      <h2>Cadastrar Ministério (UC02)</h2>
      <form id="form-ministerio">
        <div class="form-group">
          <label>Nome do Ministério:</label>
          <input type="text" id="min-nome" required placeholder="Ex: Louvor, Som e Mídia">
        </div>
        <div class="form-group">
          <label>Funções Obrigatórias (vírgula):</label>
          <input type="text" id="min-funcoes" required placeholder="Ex: Baixista, Baterista, Operador de Áudio">
        </div>
        <button type="submit" class="btn btn-primary">Salvar Ministério</button>
      </form>
    </section>

    <!-- Form Voluntário -->
    <section class="card">
      <h2>Cadastrar Voluntário (UC01)</h2>
      <form id="form-voluntario">
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="vol-nome" required placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
          <label>Ministério:</label>
          <input type="text" id="vol-ministerio" required placeholder="Ex: Louvor">
        </div>
        <div class="form-group">
          <label>Funções Aptas (vírgula):</label>
          <input type="text" id="vol-funcoes" required placeholder="Ex: Baixista, Violonista">
        </div>
        <button type="submit" class="btn btn-primary">Salvar Voluntário</button>
      </form>
    </section>

    <!-- Listagem -->
    <section class="card">
      <h2>Voluntários Cadastrados</h2>
      <ul id="lista-voluntarios" class="lista"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
